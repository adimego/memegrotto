<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="Open categories menu" aria-controls="sidebar" aria-expanded="false">☰</button>
  <a class="brand" href="#" aria-label="MemeGrotto home"><span class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><linearGradient id="mgcHRock" gradientUnits="userSpaceOnUse" x1="10" y1="60" x2="40" y2="4"><stop offset="0" stop-color="#7f5af0"/><stop offset=".55" stop-color="#e53170"/><stop offset="1" stop-color="#ff8906"/></linearGradient><radialGradient id="mgcHGlow" gradientUnits="userSpaceOnUse" cx="32" cy="42" r="18"><stop offset="0" stop-color="#7f5af0" stop-opacity=".6"/><stop offset="1" stop-color="#7f5af0" stop-opacity="0"/></radialGradient><clipPath id="mgcHEyeL"><ellipse cx="24.3" cy="39.5" rx="5.7" ry="6.3"/></clipPath><clipPath id="mgcHEyeR"><ellipse cx="39.7" cy="39.5" rx="5.7" ry="6.3"/></clipPath></defs><path fill="#0f0e17" d="M11 60 C11 34 19 17 32 17 C45 17 53 34 53 60 Z"/><path fill="url(#mgcHGlow)" d="M11 60 C11 34 19 17 32 17 C45 17 53 34 53 60 Z"/><path fill="url(#mgcHRock)" fill-rule="evenodd" d="M2 60 C2 28 15 5 32 5 C49 5 62 28 62 60 Z M11 60 C11 34 19 17 32 17 C45 17 53 34 53 60 Z"/><path fill="url(#mgcHRock)" d="M19.5 15 L24.5 30.5 L29 12 Z M35 12 L39.5 30.5 L44.5 15 Z"/><path fill="#fffffe" opacity=".28" d="M4.5 60 C4.5 32 14 11 28 8 C17 14 8.5 32 8.5 60 Z"/><g clip-path="url(#mgcHEyeL)"><rect x="17.3" y="30" width="14" height="18" fill="#ffd166"/><circle cx="26.7" cy="41.3" r="3.1" fill="#0f0e17"/><path fill="#4a2f9e" d="M17.3 30 H31.3 V38.3 L17.3 38.3 Z"/></g><path d="M18.0 38.30 L30.6 38.30" stroke="#e53170" stroke-width="2.2" stroke-linecap="round"/><g clip-path="url(#mgcHEyeR)"><rect x="32.7" y="30" width="14" height="18" fill="#ffd166"/><circle cx="42.1" cy="41.3" r="3.1" fill="#0f0e17"/><path fill="#4a2f9e" d="M32.7 30 H46.7 V38.3 L32.7 38.3 Z"/></g><path d="M33.400000000000006 38.30 L46.0 38.30" stroke="#e53170" stroke-width="2.2" stroke-linecap="round"/><path d="M25 51.5 L35 51.5 Q38.8 51.3 41 48.3" fill="none" stroke="#ff8906" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path fill="#ffd166" d="M53 1.5 l1.5 3.4 3.4 1.5 -3.4 1.5 L53 11.3 l-1.5-3.4 -3.4-1.5 3.4-1.5Z"/></svg></span><span>Meme<b>Grotto</b></span></a>
  <div class="search">
    <span>🔎</span>
    <input id="q" type="search" placeholder="Search titles & tags… (try “harambe” or “will smith”)" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <label class="nsfw-toggle" title="Show crude / NSFW-language memes">
    <input type="checkbox" id="nsfw" checked><span class="sw"></span><span class="lbl">🌶️ Crude</span>
  </label>
  <select id="sort" aria-label="Sort">
    <option value="popular" data-short="🔥 Popular">Most popular ▲</option>
    <option value="az" data-short="🔤 A → Z">A → Z</option>
    <option value="new" data-short="🆕 Newest">Recently added</option>
    <option value="shuffle" data-short="🎲 Shuffle">Shuffle 🎲</option>
  </select>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Browse">
    <div class="sb-head"><span>Browse</span><button class="sb-close" id="sbClose" aria-label="Close menu">✕</button></div>
    <h3>Categories</h3>
    <nav id="cats"></nav>
    <h3>Spotlight</h3>
    <div id="spot" class="spot"></div>
    <h3>Popular tags</h3>
    <div id="tagcloud" class="tagcloud"></div>
    <p class="foot">Images from <a href="https://imgflip.com" target="_blank" rel="noopener">Imgflip</a> &amp; <a href="https://www.reddit.com/r/memes" target="_blank" rel="noopener">r/memes</a>. All memes belong to their creators.</p>
  </aside>

  <main>
    <section class="hero">
      <h1 id="heading">All memes</h1>
      <p id="sub"></p>
      <div id="active" class="active"></div>
    </section>
    <div id="grid" class="grid"></div>
    <p id="more" class="more" hidden></p>
    <div id="empty" class="empty" hidden>
      <div class="big">🤷</div><p>No memes match that. <button id="reset">Reset filters</button></p>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="lightbox" id="lb" hidden>
  <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
  <button class="lb-nav prev" id="lbPrev" aria-label="Previous">‹</button>
  <div class="lb-body">
    <div class="lb-img"><img id="lbImg" alt=""><video id="lbVid" controls loop muted playsinline preload="metadata" hidden></video></div>
    <div class="lb-info">
      <p class="lb-hint">Swipe ← → for more · swipe down to close</p>
      <div class="lb-top"><span class="pill" id="lbCat"></span><span id="lbVote"></span></div>
      <h2 id="lbTitle"></h2>
      <div class="tags" id="lbTags"></div>
      <p class="caption" id="lbCaption"></p>
      <dl>
        <dt>Source</dt><dd id="lbSource"></dd>
        <dt>Credit</dt><dd id="lbAttr"></dd>
        <dt>Added</dt><dd id="lbDate"></dd>
        <dt>Size</dt><dd id="lbSize"></dd>
      </dl>
      <div class="lb-actions">
        <a id="lbOpen" class="btn primary" target="_blank" rel="noopener">View source ↗</a>
        <a id="lbDl" class="btn" download>Download</a>
        <button id="lbShare" class="btn">↗ Share</button>
        <button id="lbEdit" class="btn">✏️ Make your own</button>
      </div>
    </div>
  </div>
  <button class="lb-nav next" id="lbNext" aria-label="Next">›</button>
</div>
<div class="share-backdrop" id="shareBackdrop" hidden></div>
<div class="share-menu" id="shareMenu" role="dialog" aria-label="Share meme" hidden></div>
<div id="toast" class="toast"></div>
<script src="app.js?v=c7ae95a8bc"></script>
<script src="features.js?v=8ae1ceaa9f"></script>
<script src="play.js?v=23941755d4"></script>
<script src="community.js?v=e6c0da93e7"></script>
<script src="editor.js?v=7954ec3734"></script>
</body>
</html>
