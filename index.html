<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="theme-color" content="#0f0e17">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MemeGrotto — a library of internet memes</title>
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<meta name="description" content="MemeGrotto: 2,000+ internet memes sorted into categories, from classic templates and Harambe to Sonic, Will Smith and fresh Reddit picks. Search, upvote and share.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MemeGrotto">
<meta property="og:title" content="MemeGrotto: a library of internet memes">
<meta property="og:description" content="2,000+ categorized memes: classics, Harambe, Sonic, Will Smith, trending Reddit picks. Search, upvote and share.">
<meta property="og:url" content="https://adimego.github.io/memespire/">
<meta property="og:image" content="https://adimego.github.io/memespire/og.jpg?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The MemeGrotto logo over a collage of memes">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="MemeGrotto: a library of internet memes">
<meta name="twitter:description" content="2,000+ categorized memes. Search, upvote and share.">
<meta name="twitter:image" content="https://adimego.github.io/memespire/og.jpg?v=3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MemeGrotto">
<link rel="canonical" href="https://adimego.github.io/memespire/">
<link rel="stylesheet" href="style.css?v=df4d4b6a57">
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="Open categories menu" aria-controls="sidebar" aria-expanded="false">☰</button>
  <a class="brand" href="#" aria-label="MemeGrotto home"><span class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -3 66 66" aria-hidden="true" focusable="false"><defs>  <linearGradient id="msgH" x1="0" y1="1" x2="0.35" y2="0">    <stop offset="0" stop-color="#7f5af0"/><stop offset=".5" stop-color="#e53170"/><stop offset="1" stop-color="#ff8906"/>  </linearGradient></defs><path fill="url(#msgH)" d="M32 2 L36.5 21 H39.5 L41.5 37 H45.5 L49 60 H15 L18.5 37 H22.5 L24.5 21 H27.5 Z"/><path fill="#fffffe" opacity=".28" d="M32 2 L32 60 H15 L18.5 37 H22.5 L24.5 21 H27.5 Z"/><circle cx="28.4" cy="29.5" r="2.2" fill="#0f0e17"/><circle cx="35.6" cy="29.5" r="2.2" fill="#0f0e17"/><path d="M27.6 45.5 Q32 50 36.4 45.5" fill="none" stroke="#0f0e17" stroke-width="2.4" stroke-linecap="round"/><path fill="#0f0e17" d="M28.5 60 V55.5 a3.5 3.5 0 0 1 7 0 V60 Z"/><path fill="#ffd166" d="M32 0 l1.1 2.4 2.4 1.1 -2.4 1.1 L32 7 l-1.1-2.4 -2.4-1.1 2.4-1.1Z" transform="translate(0 -1) scale(1)"/></svg></span><span>Meme<b>Grotto</b></span></a>
  <div class="search">
    <span>🔎</span>
    <input id="q" type="search" placeholder="Search titles & tags… (try “harambe” or “will smith”)" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <label class="nsfw-toggle" title="Show crude / NSFW-language memes">
    <input type="checkbox" id="nsfw" checked><span class="sw"></span><span class="lbl">🌶️ Crude</span>
  </label>
  <select id="sort" aria-label="Sort">
    <option value="popular" data-short="🔥 Popular">Most popular ▲</option>
    <option value="az" data-short="🔤 A → Z">A → Z</option>
    <option value="new" data-short="🆕 Newest">Recently added</option>
    <option value="shuffle" data-short="🎲 Shuffle">Shuffle 🎲</option>
  </select>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Browse">
    <div class="sb-head"><span>Browse</span><button class="sb-close" id="sbClose" aria-label="Close menu">✕</button></div>
    <h3>Categories</h3>
    <nav id="cats"></nav>
    <h3>Spotlight</h3>
    <div id="spot" class="spot"></div>
    <h3>Popular tags</h3>
    <div id="tagcloud" class="tagcloud"></div>
    <p class="foot">Images from <a href="https://imgflip.com" target="_blank" rel="noopener">Imgflip</a> &amp; <a href="https://www.reddit.com/r/memes" target="_blank" rel="noopener">r/memes</a>. All memes belong to their creators.</p>
  </aside>

  <main>
    <section class="hero">
      <h1 id="heading">All memes</h1>
      <p id="sub"></p>
      <div id="active" class="active"></div>
    </section>
    <div id="grid" class="grid"></div>
    <p id="more" class="more" hidden></p>
    <div id="empty" class="empty" hidden>
      <div class="big">🤷</div><p>No memes match that. <button id="reset">Reset filters</button></p>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="lightbox" id="lb" hidden>
  <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
  <button class="lb-nav prev" id="lbPrev" aria-label="Previous">‹</button>
  <div class="lb-body">
    <div class="lb-img"><img id="lbImg" alt=""><video id="lbVid" controls loop muted playsinline preload="metadata" hidden></video></div>
    <div class="lb-info">
      <p class="lb-hint">Swipe ← → for more · swipe down to close</p>
      <div class="lb-top"><span class="pill" id="lbCat"></span><span id="lbVote"></span></div>
      <h2 id="lbTitle"></h2>
      <div class="tags" id="lbTags"></div>
      <p class="caption" id="lbCaption"></p>
      <dl>
        <dt>Source</dt><dd id="lbSource"></dd>
        <dt>Credit</dt><dd id="lbAttr"></dd>
        <dt>Added</dt><dd id="lbDate"></dd>
        <dt>Size</dt><dd id="lbSize"></dd>
      </dl>
      <div class="lb-actions">
        <a id="lbOpen" class="btn primary" target="_blank" rel="noopener">View source ↗</a>
        <a id="lbDl" class="btn" download>Download</a>
        <button id="lbShare" class="btn">↗ Share</button>
        <button id="lbEdit" class="btn">✏️ Make your own</button>
      </div>
    </div>
  </div>
  <button class="lb-nav next" id="lbNext" aria-label="Next">›</button>
</div>
<div class="share-backdrop" id="shareBackdrop" hidden></div>
<div class="share-menu" id="shareMenu" role="dialog" aria-label="Share meme" hidden></div>
<div id="toast" class="toast"></div>
<script src="app.js?v=ab037400a9"></script>
<script src="features.js?v=498ad27e42"></script>
<script src="play.js?v=175639ca8e"></script>
<script src="community.js?v=c628556e77"></script>
<script src="editor.js?v=53b4a9c40e"></script>
</body>
</html>
